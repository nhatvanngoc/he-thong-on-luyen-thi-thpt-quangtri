<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="chloroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="cShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="360" rx="16" fill="url(#chloroBg)" stroke="#86efac" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="350" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">
    CẤU TẠO LỤC LẠP VÀ HAI PHA CỦA QUANG HỢP Ở THỰC VẬT
  </text>
  <text x="350" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#047857">
    (Pha sáng tại màng Thylakoid &amp; Pha tối Chu trình Calvin tại chất nền Stroma)
  </text>

  <!-- Big Chloroplast Outer & Inner Membrane Shape -->
  <rect x="35" y="70" width="630" height="265" rx="30" fill="#ecfdf5" stroke="#059669" stroke-width="3" filter="url(#cShadow)"/>
  <rect x="42" y="77" width="616" height="251" rx="25" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="65" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">
    MÀNG KÉP LỤC LẠP (Màng ngoài &amp; Màng trong)
  </text>
  <text x="560" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#047857">
    STROMA (Chất nền)
  </text>

  <!-- LEFT: PHA SÁNG (MÀNG THYLAKOID / GRANA) -->
  <g transform="translate(60, 110)">
    <rect width="250" height="205" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="125" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#854d0e">
      PHA SÁNG (Ở THYLAKOID)
    </text>

    <!-- Sun Light Input -->
    <path d="M 40 -15 L 60 10" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <path d="M 60 -20 L 75 10" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 -15 L 90 10" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <text x="65" y="-22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#b45309">Ánh sáng mặt trời</text>

    <!-- Water input -->
    <rect x="15" y="45" width="80" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="55" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">H₂O</text>

    <!-- Thylakoid Granum Stack -->
    <g transform="translate(130, 45)">
      <rect x="0" y="0" width="90" height="18" rx="5" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="22" width="90" height="18" rx="5" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
      <rect x="0" y="44" width="90" height="18" rx="5" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
      <text x="45" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532d">Grana (Thylakoid)</text>
    </g>

    <!-- Oxygen Output -->
    <path d="M 175 110 L 175 145" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="135" y="150" width="80" height="30" rx="6" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/>
    <text x="175" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#14532d">O₂ (Thải ra)</text>

    <!-- Photolysis note -->
    <text x="15" y="115" font-family="system-ui, sans-serif" font-size="10.5" fill="#713f12">Quang phân ly:</text>
    <text x="15" y="130" font-family="system-ui, sans-serif" font-size="9.5" fill="#713f12">2H₂O → 4H⁺ + 4e⁻ + O₂</text>
  </g>

  <!-- MIDDLE: ENERGY TRANSFER ARROWS -->
  <g transform="translate(320, 140)">
    <!-- ATP / NADPH to Dark Reaction -->
    <path d="M 0 20 C 30 5, 40 5, 65 20" stroke="#16a34a" stroke-width="3" fill="none"/>
    <polygon points="65,20 57,14 59,23" fill="#16a34a"/>
    <text x="32" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803d">ATP &amp; NADPH</text>

    <!-- ADP + Pi & NADP+ back to Light Reaction -->
    <path d="M 65 65 C 40 80, 30 80, 0 65" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4,3" fill="none"/>
    <polygon points="0,65 8,71 6,62" fill="#64748b"/>
    <text x="32" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">ADP, Pi, NADP⁺</text>
  </g>

  <!-- RIGHT: PHA TỐI (CHU TRÌNH CALVIN Ở STROMA) -->
  <g transform="translate(395, 110)">
    <rect width="250" height="205" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="125" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0369a1">
      PHA TỐI (CHU TRÌNH CALVIN)
    </text>

    <!-- CO2 Input -->
    <rect x="85" y="42" width="80" height="28" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="125" y="61" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">CO₂ (Vào)</text>

    <!-- Calvin Cycle Circle -->
    <circle cx="125" cy="115" r="32" fill="#bae6fd" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="125" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369a1">Chu trình</text>
    <text x="125" y="125" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#0369a1">Calvin (C₃)</text>

    <!-- Glucose Product Output -->
    <path d="M 125 150 L 125 165" stroke="#0284c7" stroke-width="2.5"/>
    <rect x="55" y="165" width="140" height="28" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="125" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#854d0e">C₆H₁₂O₆ (Glucose/Tinh bột)</text>
  </g>
</svg>
