<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="stomaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="700" height="360" rx="16" fill="url(#stomaBg)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="350" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    CƠ CHẾ ĐÓNG VÀ MỞ KHÍ KHỔNG Ở LÁ CÂY
  </text>
  <text x="350" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">
    (Cấu tạo tế bào hình hạt đậu: Thành trong dày kém đàn hồi, thành ngoài mỏng dễ co giãn)
  </text>

  <!-- LEFT: KHÍ KHỔNG MỞ (KHI NO NƯỚC) -->
  <g transform="translate(40, 75)">
    <rect width="290" height="260" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#065f46">
      1. KHÍ KHỔNG MỞ
    </text>
    <text x="145" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#047857">
      (Khi tế bào khí khổng no nước / trương nước)
    </text>

    <!-- Guard Cells Opened (Bean shaped) -->
    <!-- Left Guard Cell -->
    <path d="M 120 75 C 70 95, 65 175, 120 195 C 100 170, 100 100, 120 75 Z" fill="#6ee7b7" stroke="#059669" stroke-width="2.5"/>
    <!-- Thick inner wall left -->
    <path d="M 120 75 C 100 100, 100 170, 120 195" stroke="#047857" stroke-width="6" fill="none"/>

    <!-- Right Guard Cell -->
    <path d="M 170 75 C 220 95, 225 175, 170 195 C 190 170, 190 100, 170 75 Z" fill="#6ee7b7" stroke="#059669" stroke-width="2.5"/>
    <!-- Thick inner wall right -->
    <path d="M 170 75 C 190 100, 190 170, 170 195" stroke="#047857" stroke-width="6" fill="none"/>

    <!-- Stomatal Pore (Opening) -->
    <ellipse cx="145" cy="135" rx="16" ry="38" fill="#1e293b"/>
    <text x="145" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff">
      LỖ KHÍ
    </text>

    <!-- Description bullets -->
    <text x="20" y="218" font-family="system-ui, sans-serif" font-size="10.5" fill="#064e3b">
      • Tế bào hút nước trương lên
    </text>
    <text x="20" y="234" font-family="system-ui, sans-serif" font-size="10.5" fill="#064e3b">
      • Thành ngoài mỏng căng dãn ra xa
    </text>
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#047857">
      • Kéo theo thành trong cong lại → Khe khí mở
    </text>
  </g>

  <!-- RIGHT: KHÍ KHỔNG ĐÓNG (KHI MẤT NƯỚC) -->
  <g transform="translate(370, 75)">
    <rect width="290" height="260" rx="12" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="145" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#9f1239">
      2. KHÍ KHỔNG ĐÓNG
    </text>
    <text x="145" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#be123c">
      (Khi tế bào hạt đậu mất nước / thiếu nước)
    </text>

    <!-- Guard Cells Closed (Deflated) -->
    <!-- Left Guard Cell -->
    <path d="M 135 75 C 95 95, 95 175, 135 195 C 130 170, 130 100, 135 75 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2"/>
    <path d="M 135 75 C 130 100, 130 170, 135 195" stroke="#9f1239" stroke-width="5" fill="none"/>

    <!-- Right Guard Cell -->
    <path d="M 155 75 C 195 95, 195 175, 155 195 C 160 170, 160 100, 155 75 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2"/>
    <path d="M 155 75 C 160 100, 160 170, 155 195" stroke="#9f1239" stroke-width="5" fill="none"/>

    <!-- Slit (closed) -->
    <line x1="145" y1="85" x2="145" y2="185" stroke="#881337" stroke-width="2.5"/>

    <!-- Description bullets -->
    <text x="20" y="218" font-family="system-ui, sans-serif" font-size="10.5" fill="#881337">
      • Tế bào mất nước xẹp xuống
    </text>
    <text x="20" y="234" font-family="system-ui, sans-serif" font-size="10.5" fill="#881337">
      • Thành mỏng hết căng, trở về ban đầu
    </text>
    <text x="20" y="250" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239">
      • Hai thành trong ép sát nhau → Khe khí đóng
    </text>
  </g>
</svg>
