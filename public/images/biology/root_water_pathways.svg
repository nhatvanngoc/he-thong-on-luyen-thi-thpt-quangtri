<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="rootBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="360" rx="16" fill="url(#rootBg)" stroke="#86efac" stroke-width="1.5"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#065f46">
    CON ĐƯỜNG VẬN CHUYỂN NƯỚC VÀ KHOÁNG Ở RỄ CÂY
  </text>
  <text x="350" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#047857">
    (Con đường gian bào Apoplast và con đường tế bào chất Symplast qua đai Caspary)
  </text>

  <!-- Cell Layers -->
  <!-- 1. Lông hút / Biểu bì (Epidermis) -->
  <rect x="50" y="80" width="90" height="200" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="95" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#14532d">Biểu bì</text>
  <path d="M 50 180 C 20 170, 10 190, 15 180 C 10 170, 20 190, 50 180" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="95" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">Lông hút</text>

  <!-- 2. Vỏ (Cortex) -->
  <rect x="160" y="80" width="130" height="200" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)"/>
  <text x="225" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#713f12">Tế bào vỏ</text>
  <circle cx="200" cy="180" r="18" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
  <circle cx="250" cy="180" r="18" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>

  <!-- 3. Nội bì (Endodermis) với Đai Caspary -->
  <rect x="310" y="80" width="100" height="200" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7c2d12">Nội bì</text>
  
  <!-- Đai Caspary màu đỏ sẫm -->
  <rect x="348" y="130" width="24" height="100" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="360" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" transform="rotate(-90 360 175)">
    ĐAI CASPARY
  </text>

  <!-- 4. Trụ bì (Pericycle) -->
  <rect x="430" y="80" width="90" height="200" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#312e81">Trụ bì</text>

  <!-- 5. Mạch gỗ (Xylem) -->
  <rect x="540" y="80" width="110" height="200" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="595" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a">MẠCH GỖ</text>
  <circle cx="595" cy="180" r="30" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="595" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Xylem</text>

  <!-- PATH 1: Con đường gian bào (Apoplast - Nét đứt màu ĐỎ, chuyển hướng tại đai Caspary) -->
  <path d="M 25 180 L 155 180 L 155 135 L 305 135 L 335 150 L 335 200 L 430 200 L 540 200" 
        stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6,4" fill="none" stroke-linecap="round"/>
  <!-- Điểm chuyển hướng từ gian bào vào tế bào chất trước đai Caspary -->
  <circle cx="335" cy="150" r="5" fill="#dc2626"/>
  
  <!-- PATH 2: Con đường tế bào chất (Symplast - Nét liền màu XANH DƯƠNG qua chất nguyên sinh) -->
  <path d="M 25 195 L 95 195 L 200 195 L 250 195 L 360 215 L 475 195 L 565 180" 
        stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Legend Bottom -->
  <g transform="translate(80, 298)">
    <rect width="540" height="46" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Legend item 1 -->
    <line x1="20" y1="23" x2="65" y2="23" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6,4"/>
    <text x="75" y="27" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">
      Con đường gian bào (Apoplast): Bị đai Caspary chặn, buộc rẽ vào TBC
    </text>

    <!-- Legend item 2 -->
    <line x1="320" y1="23" x2="365" y2="23" stroke="#2563eb" stroke-width="3.5"/>
    <text x="375" y="27" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#1e40af">
      Con đường tế bào chất (Symplast)
    </text>
  </g>
</svg>
